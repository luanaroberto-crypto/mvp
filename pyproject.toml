[project]
name = "weather-dashboard"
version = "1.1.1"  # manter igual ao arquivo VERSION (verificado em tests/test_version.py)
description = "Dashboard web de clima que consome a API do OpenWeatherMap via backend FastAPI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Luana Costa" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --strict-markers"
filterwarnings = [
    # Aviso interno do Starlette TestClient sobre migração futura para httpx2; não afeta o app.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "S", "N", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
